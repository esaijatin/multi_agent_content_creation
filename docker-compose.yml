# AstraOS — Phase 2 stack
# Usage: cp .env.example .env && docker compose up --build
# After first start, pull models:
#   docker exec astraos-ollama ollama pull qwen2.5:7b
#   docker exec astraos-ollama ollama pull llama3:8b

name: astraos

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: astraos-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-astraos}:${POSTGRES_PASSWORD:-astraos_dev_password}@postgres:5432/${POSTGRES_DB:-astraos}
      REDIS_URL: redis://redis:6379/0
      ORCHESTRATOR_URL: http://orchestrator:8001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
    networks:
      - astraos-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    container_name: astraos-orchestrator
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL_PLANNER: ${OLLAMA_MODEL_PLANNER:-qwen2.5:7b}
      OLLAMA_MODEL_WRITER: ${OLLAMA_MODEL_WRITER:-llama3:8b}
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - astraos-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/ready"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: astraos-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - astraos-net

  postgres:
    image: postgres:16-alpine
    container_name: astraos-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-astraos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-astraos_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-astraos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - astraos-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-astraos} -d ${POSTGRES_DB:-astraos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis/redis-stack-server:latest
    container_name: astraos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - astraos-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: astraos-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - astraos-net

  chroma:
    image: chromadb/chroma:latest
    container_name: astraos-chroma
    profiles: ["full"]
    ports:
      - "8100:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - astraos-net

  minio:
    image: minio/minio:latest
    container_name: astraos-minio
    profiles: ["full"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-astraos_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-astraos_minio_secret}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - astraos-net

networks:
  astraos-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  chroma_data:
  minio_data:
